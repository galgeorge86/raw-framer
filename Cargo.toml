[workspace]
resolver = "2"
members = ["app", "crates/rf-core", "crates/rf-color", "crates/rf-dng", "crates/braw-sys", "crates/rf-braw", "crates/rf-export"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Strict-1.0.0"
publish = false


[workspace.dependencies]
rf-core = { path = "crates/rf-core" }
rf-color = { path = "crates/rf-color" }
rf-dng = { path = "crates/rf-dng" }
braw-sys = { path = "crates/braw-sys" }
rf-braw = { path = "crates/rf-braw" }
rf-export = { path = "crates/rf-export" }
thiserror = "2"
log = "0.4"
half = { version = "2.7", features = ["bytemuck"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
