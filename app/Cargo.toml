[package]
name = "raw-framer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Preview Blackmagic RAW clips and export frames as Linear DNG"

[[bin]]
name = "raw-framer"
path = "src/main.rs"

[dependencies]
rf-core.workspace = true
rf-color.workspace = true
rf-dng.workspace = true
rf-braw.workspace = true
rf-export.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37"
egui-wgpu = "0.37"
rfd = "0.18"
cpal = "0.18"
crossbeam-channel = "0.5"
parking_lot = "0.12"
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
rayon.workspace = true

[dev-dependencies]
pollster = "0.4"
